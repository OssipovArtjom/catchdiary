<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch: Fishing Diary</title>
<style>
:root { --bg:#ffffff; --fg:#1c1d1f; --muted:#5d6065; --line:#e3e5e8; --accent:#0a84ff; --mark:#fff3b0; }
@media (prefers-color-scheme: dark) { :root { --bg:#17191c; --fg:#ececee; --muted:#a2a6ac; --line:#2e3238; --accent:#4da3ff; --mark:#5a4a00; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
main { max-width:720px; margin:0 auto; padding:32px 20px 64px; }
h1 { font-size:2rem; line-height:1.2; margin:0 0 .5em; }
h2 { font-size:1.25rem; margin:2em 0 .5em; padding-top:1em; border-top:1px solid var(--line); }
p, li { margin:.6em 0; }
ul { padding-left:1.3em; }
strong { font-weight:650; }
mark { background:var(--mark); color:inherit; padding:0 .25em; border-radius:4px; }
a { color:var(--accent); }
</style>
</head>
<body>
<main>
<h1>Catch: Fishing Diary</h1>
<p>Catch is a private fishing diary for iPhone. Log your catches with photos, place, weather and moon, and look back at them on a map and in your stats. Your diary is private, with no ads and no tracking.</p>
<ul>
<li><a href="/support">Support</a></li>
<li><a href="/privacy">Privacy Policy</a></li>
</ul>
</main>
</body>
</html>
